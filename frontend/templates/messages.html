<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages — {{ app_name }}</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/overrides.css"></head><body class="app-body" data-username="{{ username }}" data-active-contact="{{ active_contact or '' }}">{% include "partials/sidebar.html" %}<main class="workspace"><section class="view messages-view"><div class="inbox-pane"><div class="inbox-head"><div><p class="eyebrow">PRIVATE INBOX</p><h1>Messages</h1></div><a class="icon-button" href="/search">✎</a></div><label class="search-field"><span>⌕</span><input id="inbox-filter" type="search" placeholder="Search messages"></label><div id="conversation-list" class="conversation-list"><div class="skeleton-row"></div><div class="skeleton-row"></div></div></div><div class="thread-pane"><div class="empty-thread" id="empty-thread"><div class="thread-orb">✦</div><h2>Your conversations live here.</h2><p>Choose a connection to begin.</p><a class="secondary-button" href="/search">Find people</a></div><div class="thread-content" id="thread-content" hidden><header class="thread-header"><a class="mobile-back" href="/messages">‹</a><div class="avatar" id="thread-avatar">A</div><div><h2 id="thread-name">@username</h2><p><i class="online-dot"></i> Available to message</p></div></header><div id="message-list" class="message-list"></div><form class="composer" id="message-form"><button type="button" class="composer-action">＋</button><input id="message-input" maxlength="2000" placeholder="Message..."><button class="send-button" type="submit">↑</button></form></div></div></section></main><div id="toast-region" class="toast-region"></div><script src="/static/app.js" defer></script></body></html>
