<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — {{ app_name }}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="/"><span class="brand-mark">{{ app_name[0]|upper }}</span><span class="brand-name">{{ app_name }}</span></a><main class="auth-card"><p class="eyebrow">START HERE</p><h1>Make your space.</h1><p class="auth-subtitle">A username is all people need to find you.</p><form id="registerForm" class="auth-form"><label>Username<input id="username" name="username" autocomplete="username" minlength="3" maxlength="20" required><small>3–20 characters: letters, numbers, _ or -</small></label><label>Password<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm password<input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></label><button class="primary-button" type="submit">Create account <span>→</span></button><p id="responseMessage" class="form-message" aria-live="polite"></p></form><p class="auth-switch">Already have an account? <a href="/login">Log in</a></p></main><button class="landing-theme" id="theme-toggle" aria-label="Toggle color theme">◐</button><script src="/static/app.js" defer></script></body></html>
