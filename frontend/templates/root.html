<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AetherChat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>✨ AetherChat</h2>
            </div>
            
            <nav class="nav-menu">
                <a href="#" class="nav-item active" id="nav-search"><span>🔍</span> Search</a>
                <a href="#" class="nav-item" id="nav-pending"><span>🔔</span> Requests</a>
                <a href="#" class="nav-item" id="nav-messages"><span>💬</span> Messages</a>
                <a href="/profile/{{ username }}" class="nav-item" id="nav-profile"><span>👤</span> Profile</a>
            </nav>

            <div class="sidebar-footer">
                <button type="button" class="logout-btn" id="logout-btn">🚪 Log Out</button>
            </div>
        </aside>

        <!-- Main Content Window -->
        <main class="main-content">
            <header class="content-header">
                <h2>👋 Welcome back, <span id="username-display">{{ username }}</span></h2>
            </header>

            <section class="content-body" id="dynamic-content">
                
                <!-- SEARCH VIEW -->
                <div class="search-container view-section" id="search-view">
                    <h3>Find Users</h3>
                    <div class="search-box">
                        <input type="text" id="user-search-input" placeholder="Search for a username..." autocomplete="off">
                    </div>
                    
                    <div class="search-results" id="search-results">
                        <p class="placeholder-text">Type a username above to search.</p>
                    </div>
                </div>

                <!-- PENDING REQUESTS VIEW -->
                <div class="search-container view-section" id="pending-view" style="display: none;">
                    <h3>Connection Requests</h3>
                    <div class="search-results" id="pending-results">
                        <p class="placeholder-text">No pending requests.</p>
                    </div>
                </div>

                <!-- MESSAGES VIEW -->
                <div class="messages-container view-section" id="messages-view" style="display: none;">
                    <div class="messages-list-panel">
                        <h3>Messages</h3>
                        <div id="messages-list">
                            <p class="placeholder-text">Loading your chats...</p>
                        </div>
                    </div>

                    <div class="messages-chat-panel">
                        <div class="messages-chat-header">
                            <h4 id="chat-header-username">Select a contact</h4>
                        </div>
                        <div id="chat-box" class="chat-box">
                            <p class="placeholder-text">Choose a connection to start chatting.</p>
                        </div>
                        <div class="chat-input-row">
                            <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off">
                            <button id="send-message-btn" type="button">Send</button>
                        </div>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <!-- Modular JS Files -->
    <script src="/static/app.js"></script>
    <script src="/static/search.js"></script>
    <script src="/static/connections.js"></script>
    <script src="/static/messages.js"></script>
</body>
</html>
