<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — {{ app_name }}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="/"><span class="brand-mark">{{ app_name[0]|upper }}</span><span class="brand-name">{{ app_name }}</span></a><main class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in to your space.</h1><p class="auth-subtitle">Your conversations are waiting.</p><form id="loginForm" class="auth-form"><label>Username<input id="username" name="username" autocomplete="username" required></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Log in <span>→</span></button><p id="responseMessage" class="form-message" aria-live="polite"></p></form><p class="auth-switch">New here? <a href="/register">Create an account</a></p></main><button class="landing-theme" id="theme-toggle" aria-label="Toggle color theme">◐</button><script src="/static/app.js" defer></script></body></html>
