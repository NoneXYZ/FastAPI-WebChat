<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name | default('LocalChat') }} — Private by design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --surface: #12141b;
      --surface-2: #181b24;
      --surface-3: #202430;
      --text: #f4f5f7;
      --muted: #9096a6;
      --faint: #626978;
      --line: rgba(255, 255, 255, .09);
      --line-strong: rgba(255, 255, 255, .15);
      --accent: #c7ff4a;
      --shadow: 0 22px 70px rgba(0, 0, 0, .25);
    }
    [data-theme="light"] {
      --bg: #f7f7f5;
      --surface: #fff;
      --surface-2: #f1f1ee;
      --surface-3: #e9e9e5;
      --text: #171815;
      --muted: #696b62;
      --faint: #898b82;
      --line: rgba(19, 20, 16, .1);
      --line-strong: rgba(19, 20, 16, .18);
      --accent: #b9f13d;
      --shadow: 0 22px 70px rgba(25, 25, 20, .1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }
    h1, h2, h3, p { margin: 0; }
    
    .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; font-size: 22px; letter-spacing: -1px; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: var(--accent); color: #101307; font-size: 16px; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .15em; color: var(--faint); }
    
    .primary-button, .secondary-button {
      min-height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 12px;
      font-weight: 700;
    }
    .primary-button { background: var(--accent); color: #151a09; }
    .secondary-button { border: 1px solid var(--line-strong); background: transparent; }
    
    /* Fixed hero-actions to prevent button overlap */
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
      margin-top: 20px;
    }

    .landing, .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--bg);
    }
    .landing-card, .auth-card {
      width: min(620px, 100%);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      text-align: center;
    }
    .landing-theme {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text);
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
    }
    .legal-copy {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
    }
    .hero-copy {
      margin: 15px 0 25px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .hero-orb {
      font-size: 24px;
      margin: 15px 0;
      color: var(--accent);
    }
  </style>
</head>
<body class="landing">
  <main class="landing-card">
    <a class="brand landing-brand" href="/">
      <span class="brand-mark">{{ app_name[0]|upper }}</span>
      <span class="brand-name">{{ app_name }}</span>
    </a>
    <div class="hero-orb">✦</div>
    <p class="eyebrow">A QUIETER KIND OF SOCIAL</p>
    <p class="hero-copy">{{ app_name }} is a focused private space for the people you choose to let in.</p>
    <div class="hero-actions">
      <a class="primary-button" href="/register">Create your account <span>→</span></a>
      <a class="secondary-button" href="/login">Log in</a>
    </div>
    <p class="legal-copy">By continuing, you agree to keep it kind.</p>
  </main>
  <button class="landing-theme" id="theme-toggle" aria-label="Toggle color theme">◐</button>
  <script src="/static/app.js" defer></script>
</body>
</html>
